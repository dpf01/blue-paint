<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is My Blue Your Blue? (Paint Mix Edition)</title>
    <style>
        :root {
            --bg-color: #000; 
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            transition: background-color 0.4s ease;
            display: flex;
            flex-direction: column;
            color: white;
        }

        #main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ui {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            padding: 2.5rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            max-width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .button-container {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        button {
            padding: 15px 45px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            font-weight: 700;
            color: #111;
            background: white;
        }

        button:active { transform: scale(0.95); }

        /* History Section */
        details {
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(255,255,255,0.2);
            width: 100%;
            max-height: 40vh;
            overflow-y: auto;
        }

        summary {
            padding: 15px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            list-style: none;
            background: rgba(255,255,255,0.05);
        }

        summary:hover { background: rgba(255,255,255,0.1); }

        .history-row {
            display: grid;
            grid-template-columns: 60px 1fr 180px 80px;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .spectrum-track {
            position: relative;
            height: 24px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin: 0 20px;
        }

        .marker {
            position: absolute;
            width: 20px;
            height: 20px;
            top: 2px;
            border: 2px solid white;
            border-radius: 4px;
            transform: translateX(-50%);
        }

        .end-cap {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .hex-info {
            font-family: monospace;
            opacity: 0.8;
        }

        #result { display: none; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="ui">
            <div id="quiz">
                <h1 style="margin:0 0 10px 0;">Is this Blue or Green?</h1>
                <p id="progress" style="opacity:0.7; margin-bottom:20px;">Trial 1 / 12</p>
                <div class="button-container">
                    <button onclick="vote('green')">Green</button>
                    <button onclick="vote('blue')">Blue</button>
                </div>
            </div>

            <div id="result">
                <h1>Boundary Found</h1>
                <div id="final-hex" style="font-size: 2rem; font-family: monospace; margin-bottom:10px;"></div>
                <p id="description"></p>
                <button onclick="location.reload()" style="margin-top:20px;">Restart</button>
            </div>
        </div>
    </div>

    <details open>
        <summary>View Evaluation History</summary>
        <div id="history-list">
            <div class="history-row" style="font-weight:bold; opacity:0.6; padding-bottom:5px;">
                <div>Trial</div>
                <div style="display:flex; justify-content: space-between; padding: 0 20px;">
                    <div style="display:flex; align-items:center; gap:5px;"><div class="end-cap" style="background:#00a550;"></div> Green</div>
                    <div style="display:flex; align-items:center; gap:5px;">Blue <div class="end-cap" style="background:#0047ab;"></div></div>
                </div>
                <div>Value</div>
                <div>Choice</div>
            </div>
            </div>
    </details>

    <script>
        const PIGMENT_GREEN = { r: 0, g: 165, b: 80 }; 
        const PIGMENT_BLUE = { r: 0, g: 71, b: 171 };
        const PHI = (Math.sqrt(5) - 1) / 2;
        const MAX_STEPS = 12;

        let minT = 0;
        let maxT = 1;
        let stepCount = 0;
        let currentT;

        // 1. Randomized Initial Start
        function init() {
            const isGreenStart = Math.random() < 0.5;
            if (isGreenStart) {
                currentT = Math.random() * 0.4; // 0 to 0.4
            } else {
                currentT = 0.6 + Math.random() * 0.4; // 0.6 to 1.0
            }
            updateScreen();
        }

        function mixPaint(w) {
            const w1 = 1 - w;
            const c1 = { r: 255 - PIGMENT_GREEN.r, g: 255 - PIGMENT_GREEN.g, b: 255 - PIGMENT_GREEN.b };
            const c2 = { r: 255 - PIGMENT_BLUE.r, g: 255 - PIGMENT_BLUE.g, b: 255 - PIGMENT_BLUE.b };
            
            const mixed = {
                r: Math.round(255 - (c1.r * w1 + c2.r * w)),
                g: Math.round(255 - (c1.g * w1 + c2.g * w)),
                b: Math.round(255 - (c1.b * w1 + c2.b * w))
            };
            return mixed;
        }

        function rgbToHex(rgb) {
            return "#" + [rgb.r, rgb.g, rgb.b].map(x => x.toString(16).padStart(2, '0')).join("");
        }

        function updateScreen() {
            const color = mixPaint(currentT);
            const hex = rgbToHex(color);
            document.documentElement.style.setProperty('--bg-color', hex);
            document.getElementById('progress').innerText = `Trial ${stepCount + 1} / ${MAX_STEPS}`;
        }

        function addHistoryRow(choice, tVal, hex) {
            const list = document.getElementById('history-list');
            const row = document.createElement('div');
            row.className = 'history-row';
            
            const percentage = Math.round(tVal * 100);
            
            row.innerHTML = `
                <div>#${stepCount}</div>
                <div class="spectrum-track">
                    <div class="marker" style="left: ${percentage}%; background: ${hex};"></div>
                </div>
                <div class="hex-info">${hex} (${percentage}%)</div>
                <div style="text-transform: capitalize; font-weight: bold; color: ${choice === 'green' ? '#4ade80' : '#60a5fa'}">${choice}</div>
            `;
            list.appendChild(row);
            // Auto-scroll history to bottom
            const details = document.querySelector('details');
            details.scrollTop = details.scrollHeight;
        }

        function vote(choice) {
            const color = mixPaint(currentT);
            const hex = rgbToHex(color);
            stepCount++;
            
            addHistoryRow(choice, currentT, hex);

            if (choice === 'green') {
                minT = currentT;
                currentT = minT + (maxT - minT) * PHI;
            } else {
                maxT = currentT;
                currentT = maxT - (maxT - minT) * PHI;
            }

            if (stepCount >= MAX_STEPS) {
                showResult();
            } else {
                updateScreen();
            }
        }

        function showResult() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            const finalColor = mixPaint(currentT);
            const hex = rgbToHex(finalColor);
            document.getElementById('final-hex').innerText = hex;
            document.getElementById('description').innerText = `Your personal blue-green paint boundary is at ${Math.round(currentT * 100)}% on the spectrum.`;
        }

        init();
    </script>
</body>
</html>
