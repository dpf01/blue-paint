<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Manifold: Precision Search</title>
    <style>
        :root {
            --phtalo-green: rgb(0, 165, 80);
            --cobalt-blue: rgb(0, 71, 171);
            --bg-color: #1a1a1a;
        }

        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100%;
            font-family: -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; color: white;
            background-color: var(--bg-color); overflow: hidden;
        }

        #main-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            transition: background-color 0.6s ease;
        }

        #ui {
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(20px);
            padding: 2rem; border-radius: 30px; text-align: center;
            width: 380px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .button-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .row { display: flex; gap: 10px; }
        
        button {
            flex: 1; padding: 16px; border: none; border-radius: 14px;
            cursor: pointer; font-weight: 700; transition: all 0.2s;
            font-size: 1rem;
        }

        .btn-green { background: var(--phtalo-green); color: white; }
        .btn-blue { background: var(--cobalt-blue); color: white; }
        .btn-unsure { background: #333; color: #bbb; border: 1px solid #444; }
        .btn-stop { background: transparent; color: #ff4444; border: 1px solid #ff4444; margin-top: 10px; font-size: 0.8rem; padding: 8px; }
        
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        /* History */
        details { background: #0a0a0a; border-top: 2px solid #222; }
        details[open] { height: 35vh; }
        summary { padding: 12px; cursor: pointer; text-align: center; background: #111; font-weight: bold; font-size: 0.9rem; }
        #scroll-area { height: calc(35vh - 45px); overflow-y: auto; }

        .history-row {
            display: grid; grid-template-columns: 80px 1fr 80px;
            gap: 15px; align-items: center; padding: 10px 20px;
            border-bottom: 1px solid #1a1a1a; font-size: 0.75rem;
        }

        .track-container { position: relative; height: 20px; background: #222; border-radius: 10px; overflow: hidden; }
        .fuzzy-boundary { 
            position: absolute; height: 100%; background: rgba(255,255,255,0.12); 
            border-left: 1px solid rgba(255,255,255,0.3); border-right: 1px solid rgba(255,255,255,0.3);
        }
        .marker {
            position: absolute; width: 12px; height: 12px; top: 4px;
            border: 2px solid white; border-radius: 3px; transform: translateX(-50%); z-index: 5;
        }

        /* Results Chart */
        #chart { display: flex; align-items: flex-end; justify-content: space-around; height: 160px; margin-top: 30px; background: #000; border-radius: 12px; padding: 15px 10px; border: 1px solid #333; }
        .bar { width: 15%; position: relative; transition: height 0.8s; }
        .bar-label { position: absolute; bottom: -25px; width: 100%; text-align: center; font-size: 0.6rem; opacity: 0.7; }
        .bar-percent { position: absolute; top: -22px; width: 100%; text-align: center; font-size: 0.75rem; font-weight: bold; }
        
        /* Error Bars */
        .error-bar {
            position: absolute; left: 50%; width: 2px; background: rgba(255,255,255,0.6);
            transform: translateX(-50%);
        }
        .error-cap {
            position: absolute; left: 50%; width: 8px; height: 2px; background: rgba(255,255,255,0.6);
            transform: translateX(-50%);
        }

        #result-view { display: none; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="ui">
            <div id="quiz-view">
                <h2 id="tier-name" style="margin:0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #aaa;">-</h2>
                <h1 style="margin: 5px 0 20px 0; font-size: 1.5rem;">Blue or Green?</h1>
                
                <div class="button-stack">
                    <div class="row">
                        <button class="btn-green" onclick="recordVote('green')">Green</button>
                        <button class="btn-blue" onclick="recordVote('blue')">Blue</button>
                    </div>
                    <button class="btn-unsure" onclick="recordVote('unsure')">I'm Not Sure</button>
                    <button class="btn-stop" onclick="finish()">Stop Test & See Results</button>
                </div>
                <p id="progress-text" style="opacity:0.4; font-size: 0.7rem; margin-top: 20px;">Precision tracking...</p>
            </div>

            <div id="result-view">
                <h2 style="margin:0">Perceptual Manifold</h2>
                <div id="chart"></div>
                <p style="font-size:0.7rem; opacity:0.6; margin-top:40px; line-height: 1.4;">White lines represent the boundary uncertainty range for each paint mix.</p>
                <button onclick="location.reload()" style="margin-top:15px; width:100%; background:white; color:black; border-radius:10px;">Restart</button>
            </div>
        </div>
    </div>

    <details>
        <summary>View Data & Live Boundaries</summary>
        <div id="scroll-area">
            <div id="history-list"></div>
        </div>
    </details>

    <script>
        const PIGMENTS = {
            GREEN: { r: 0, g: 165, b: 80 },
            BLUE: { r: 0, g: 71, b: 171 },
            WHITE: { r: 255, g: 255, b: 255 },
            BLACK: { r: 15, g: 15, b: 15 }
        };

        const TIERS = [
            { name: 'Tint Max', w: 0.45, b: 0 },
            { name: 'Tint Mid', w: 0.22, b: 0 },
            { name: 'Pure', w: 0, b: 0 },
            { name: 'Shade Mid', w: 0, b: 0.35 },
            { name: 'Shade Max', w: 0, b: 0.7 }
        ];

        let tierData = TIERS.map(() => ({ min: 0, max: 1, count: 0 }));
        let history = [];
        let activeTrial = null;
        const TARGET_WIDTH = 0.05; // Stop at 5% width

        function mix(ratio, white, black) {
            const mI = {
                r: (255 - PIGMENTS.GREEN.r) * (1 - ratio) + (255 - PIGMENTS.BLUE.r) * ratio,
                g: (255 - PIGMENTS.GREEN.g) * (1 - ratio) + (255 - PIGMENTS.BLUE.g) * ratio,
                b: (255 - PIGMENTS.GREEN.b) * (1 - ratio) + (255 - PIGMENTS.BLUE.b) * ratio
            };
            const wI = { r: 255-255, g: 255-255, b: 255-255 }; // Pigment white absorbs nothing
            const bI = { r: 255 - PIGMENTS.BLACK.r, g: 255 - PIGMENTS.BLACK.g, b: 255 - PIGMENTS.BLACK.b };

            const fI = {
                r: mI.r * (1 - white - black) + (0 * white) + (bI.r * black),
                g: mI.g * (1 - white - black) + (0 * white) + (bI.g * black),
                b: mI.b * (1 - white - black) + (0 * white) + (bI.b * black)
            };

            return {
                r: Math.max(0, Math.min(255, Math.round(255 - fI.r))),
                g: Math.max(0, Math.min(255, Math.round(255 - fI.g))),
                b: Math.max(0, Math.min(255, Math.round(255 - fI.b)))
            };
        }

        function pickWidestTier() {
            // Priority 1: Pick any tier that hasn't been tested at least twice
            const untested = [];
            tierData.forEach((d, i) => { if (d.count < 1) untested.push(i); });
            if (untested.length > 0) return untested[Math.floor(Math.random() * untested.length)];

            // Priority 2: Pick the tier with the largest current uncertainty (max - min)
            let widestIdx = 0;
            let maxWidth = -1;
            tierData.forEach((d, i) => {
                const width = d.max - d.min;
                if (width > maxWidth) {
                    maxWidth = width;
                    widestIdx = i;
                }
            });
            return widestIdx;
        }

        function spawnTrial() {
            const idx = pickWidestTier();
            const tier = TIERS[idx];
            const data = tierData[idx];

            let ratio;
            // First trial for each tier: clear polarization
            if (data.count === 0) {
                ratio = Math.random() < 0.5 ? (Math.random() * 0.3) : (0.7 + Math.random() * 0.3);
            } else {
                // Focus on the current fuzzy zone with a bit of centered jitter
                const range = data.max - data.min;
                ratio = data.min + (range * 0.3) + (Math.random() * range * 0.4);
            }

            ratio = Math.max(0.01, Math.min(0.99, ratio));
            const color = mix(ratio, tier.w, tier.b);
            const hex = "#" + [color.r, color.g, color.b].map(x => x.toString(16).padStart(2, '0')).join("");

            activeTrial = { idx, ratio, hex, tierName: tier.name };
            
            document.documentElement.style.setProperty('--bg-color', hex);
            document.getElementById('tier-name').innerText = tier.name;
            
            const overallWidth = tierData.reduce((acc, d) => acc + (d.max - d.min), 0) / TIERS.length;
            const progress = Math.min(100, Math.round((1 - overallWidth) * 100));
            document.getElementById('progress-text').innerText = `Confidence: ${progress}% (Trial ${history.length + 1})`;
        }

        function recordVote(choice) {
            const d = tierData[activeTrial.idx];
            
            // Soft-clamping updates to allow for human noise
            if (choice === 'green') {
                d.min = d.min + (activeTrial.ratio - d.min) * 0.75;
            } else if (choice === 'blue') {
                d.max = d.max - (d.max - activeTrial.ratio) * 0.75;
            } else {
                // Unsure: gently push both bounds inward to center on this ratio
                d.min = d.min + (activeTrial.ratio - d.min) * 0.15;
                d.max = d.max - (d.max - activeTrial.ratio) * 0.15;
            }

            d.count++;
            addHistoryRow(activeTrial, choice, { ...d });
            history.push({ ...activeTrial, choice });

            // Termination Check
            const widest = Math.max(...tierData.map(t => t.max - t.min));
            if (widest <= TARGET_WIDTH) finish();
            else spawnTrial();
        }

        function addHistoryRow(trial, choice, boundaryState) {
            const list = document.getElementById('history-list');
            const row = document.createElement('div');
            row.className = 'history-row';
            
            const choiceColor = choice === 'green' ? 'var(--phtalo-green)' : (choice === 'blue' ? 'var(--cobalt-blue)' : '#777');
            const left = boundaryState.min * 100;
            const width = (boundaryState.max - boundaryState.min) * 100;

            row.innerHTML = `
                <div style="font-size:0.6rem; opacity:0.6; text-transform:uppercase;">${trial.tierName}</div>
                <div class="track-container">
                    <div class="fuzzy-boundary" style="left: ${left}%; width: ${width}%;"></div>
                    <div class="marker" style="left: ${trial.ratio * 100}%; background: ${trial.hex};"></div>
                </div>
                <div style="text-align:right; font-weight:bold; color:${choiceColor}">${choice.toUpperCase()}</div>
            `;
            list.prepend(row);
        }

        function finish() {
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('result-view').style.display = 'block';
            const chart = document.getElementById('chart');
            chart.innerHTML = '';

            tierData.forEach((d, i) => {
                const midpoint = (d.min + d.max) / 2;
                const c = mix(midpoint, TIERS[i].w, TIERS[i].b);
                
                const barWrapper = document.createElement('div');
                barWrapper.className = 'bar';
                barWrapper.style.height = `${midpoint * 100}%`;
                barWrapper.style.background = `rgb(${c.r},${c.g},${c.b})`;
                
                // Error Bars (representing final min/max)
                const errorBar = document.createElement('div');
                errorBar.className = 'error-bar';
                const errHeight = (d.max - d.min) * 100;
                // Position so error bar centers on top of bar
                errorBar.style.height = `${errHeight}%`;
                errorBar.style.bottom = `calc(100% - ${(d.max - midpoint) * 100}%)`;
                
                const topCap = document.createElement('div');
                topCap.className = 'error-cap';
                topCap.style.top = '0';
                
                const botCap = document.createElement('div');
                botCap.className = 'error-cap';
                botCap.style.bottom = '0';
                
                errorBar.appendChild(topCap);
                errorBar.appendChild(botCap);
                
                barWrapper.innerHTML = `
                    <div class="bar-label">${TIERS[i].name}</div>
                    <div class="bar-percent">${Math.round(midpoint * 100)}%</div>
                `;
                barWrapper.appendChild(errorBar);
                chart.appendChild(barWrapper);
            });
        }

        spawnTrial();
    </script>
</body>
</html>
