<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Manifold: 5-Tier Boundary</title>
    <style>
        :root {
            --phtalo-green: rgb(0, 165, 80);
            --cobalt-blue: rgb(0, 71, 171);
            --bg-color: #1a1a1a;
        }

        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100%;
            font-family: -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; color: white;
            background-color: var(--bg-color); overflow: hidden;
        }

        #main-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            transition: background-color 0.6s ease;
        }

        #ui {
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(20px);
            padding: 2rem; border-radius: 30px; text-align: center;
            width: 380px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .button-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }
        .row { display: flex; gap: 12px; }
        
        button {
            flex: 1; padding: 16px; border: none; border-radius: 14px;
            cursor: pointer; font-weight: 700; transition: all 0.2s;
            font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-green { background: var(--phtalo-green); color: white; }
        .btn-blue { background: var(--cobalt-blue); color: white; }
        .btn-unsure { background: #333; color: #bbb; border: 1px solid #444; }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        button:active { transform: translateY(0); }

        /* History */
        details { background: #0a0a0a; border-top: 2px solid #222; transition: height 0.3s; }
        details[open] { height: 40vh; }
        summary { padding: 12px; cursor: pointer; text-align: center; background: #111; font-weight: bold; }
        
        #scroll-area { height: calc(40vh - 45px); overflow-y: auto; }

        .history-row {
            display: grid; grid-template-columns: 80px 1fr 90px;
            gap: 15px; align-items: center; padding: 12px 20px;
            border-bottom: 1px solid #1a1a1a; font-size: 0.8rem;
        }

        /* Spectrum Track */
        .track-container { position: relative; height: 24px; background: #222; border-radius: 12px; overflow: hidden; }
        .fuzzy-boundary { 
            position: absolute; height: 100%; background: rgba(255,255,255,0.1); 
            border-left: 1px solid rgba(255,255,255,0.3);
            border-right: 1px solid rgba(255,255,255,0.3);
        }
        .marker {
            position: absolute; width: 14px; height: 14px; top: 5px;
            border: 2px solid white; border-radius: 4px; transform: translateX(-50%);
            z-index: 5;
        }

        /* Result Graph */
        #chart { display: flex; align-items: flex-end; justify-content: space-around; height: 140px; margin-top: 20px; background: #000; border-radius: 12px; padding: 10px; }
        .bar { width: 15%; position: relative; transition: height 0.8s ease-out; }
        .bar-label { position: absolute; top: -18px; width: 100%; text-align: center; font-size: 0.6rem; opacity: 0.7; }

        #result-view { display: none; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="ui">
            <div id="quiz-view">
                <h2 id="tier-name" style="margin:0; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; color: #aaa;">Vibrant</h2>
                <h1 style="margin: 5px 0 20px 0; font-size: 1.5rem;">Blue or Green?</h1>
                
                <div class="button-stack">
                    <div class="row">
                        <button class="btn-green" onclick="recordVote('green')">Green</button>
                        <button class="btn-blue" onclick="recordVote('blue')">Blue</button>
                    </div>
                    <button class="btn-unsure" onclick="recordVote('unsure')">I'm Not Sure</button>
                </div>
                <p id="progress" style="opacity:0.4; font-size: 0.7rem; margin-top: 20px;">Trial 1 / 25</p>
            </div>

            <div id="result-view">
                <h2 style="margin:0">Manifold Result</h2>
                <div id="chart"></div>
                <p style="font-size:0.75rem; opacity:0.6; margin-top:15px; line-height: 1.4;">Bars show your green/blue boundary. Taller bars mean you see more green at that lightness.</p>
                <button onclick="location.reload()" style="margin-top:10px; width:100%; background:white; color:black;">Restart</button>
            </div>
        </div>
    </div>

    <details>
        <summary>View Perceptual History</summary>
        <div id="scroll-area">
            <div id="history-list"></div>
        </div>
    </details>

    <script>
        const PIGMENTS = {
            GREEN: { r: 0, g: 165, b: 80 },
            BLUE: { r: 0, g: 71, b: 171 },
            WHITE: { r: 255, g: 255, b: 255 },
            BLACK: { r: 15, g: 15, b: 15 }
        };

        const TIERS = [
            { name: 'Tint (Max)', w: 0.7, b: 0 },
            { name: 'Tint (Mid)', w: 0.35, b: 0 },
            { name: 'Pure', w: 0, b: 0 },
            { name: 'Shade (Mid)', w: 0, b: 0.35 },
            { name: 'Shade (Max)', w: 0, b: 0.7 }
        ];

        let tierData = TIERS.map(() => ({ min: 0, max: 1, count: 0 }));
        let history = [];
        let activeTrial = null;
        const MAX_TRIALS = 25;

        function mix(ratio, white, black) {
            const mI = {
                r: (255 - PIGMENTS.GREEN.r) * (1 - ratio) + (255 - PIGMENTS.BLUE.r) * ratio,
                g: (255 - PIGMENTS.GREEN.g) * (1 - ratio) + (255 - PIGMENTS.BLUE.g) * ratio,
                b: (255 - PIGMENTS.GREEN.b) * (1 - ratio) + (255 - PIGMENTS.BLUE.b) * ratio
            };
            const wI = { r: 255 - PIGMENTS.WHITE.r, g: 255 - PIGMENTS.WHITE.g, b: 255 - PIGMENTS.WHITE.b };
            const bI = { r: 255 - PIGMENTS.BLACK.r, g: 255 - PIGMENTS.BLACK.g, b: 255 - PIGMENTS.BLACK.b };

            const fI = {
                r: mI.r * (1 - white - black) + (wI.r * white) + (bI.r * black),
                g: mI.g * (1 - white - black) + (wI.g * white) + (bI.g * black),
                b: mI.b * (1 - white - black) + (wI.b * white) + (bI.b * black)
            };

            return {
                r: Math.max(0, Math.min(255, Math.round(255 - fI.r))),
                g: Math.max(0, Math.min(255, Math.round(255 - fI.g))),
                b: Math.max(0, Math.min(255, Math.round(255 - fI.b)))
            };
        }

        function pickTier() {
            // Pick from tiers with the lowest trial count
            const minCount = Math.min(...tierData.map(d => d.count));
            const candidates = [];
            tierData.forEach((d, i) => { if (d.count === minCount) candidates.push(i); });
            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function spawnTrial() {
            const idx = pickTier();
            const tier = TIERS[idx];
            const data = tierData[idx];

            let ratio;
            if (data.count === 0) {
                ratio = 0.5; // Start middle
            } else {
                const range = data.max - data.min;
                const jitter = (Math.random() - 0.5) * (range * 0.4); 
                ratio = ((data.min + data.max) / 2) + jitter;
            }

            ratio = Math.max(0.05, Math.min(0.95, ratio));
            const color = mix(ratio, tier.w, tier.b);
            const hex = "#" + [color.r, color.g, color.b].map(x => x.toString(16).padStart(2, '0')).join("");

            activeTrial = { idx, ratio, hex, tierName: tier.name };
            
            document.documentElement.style.setProperty('--bg-color', hex);
            document.getElementById('tier-name').innerText = tier.name;
            document.getElementById('progress').innerText = `Trial ${history.length + 1} / ${MAX_TRIALS}`;
        }

        function recordVote(choice) {
            const d = tierData[activeTrial.idx];
            
            // Fuzzy logic update
            if (choice === 'green') {
                d.min = Math.max(d.min, activeTrial.ratio * 0.9);
            } else if (choice === 'blue') {
                d.max = Math.min(d.max, 1 - (1 - activeTrial.ratio) * 0.9);
            } else {
                // Unsure pulls bounds in much more gently
                d.min = Math.max(d.min, activeTrial.ratio - 0.15);
                d.max = Math.min(d.max, activeTrial.ratio + 0.15);
            }

            d.count++;
            addHistoryRow(activeTrial, choice, { ...d });
            history.push({ ...activeTrial, choice });

            if (history.length >= MAX_TRIALS) finish();
            else spawnTrial();
        }

        function addHistoryRow(trial, choice, boundaryState) {
            const list = document.getElementById('history-list');
            const row = document.createElement('div');
            row.className = 'history-row';
            
            const choiceColor = choice === 'green' ? 'var(--phtalo-green)' : (choice === 'blue' ? 'var(--cobalt-blue)' : '#777');
            const left = boundaryState.min * 100;
            const width = (boundaryState.max - boundaryState.min) * 100;

            row.innerHTML = `
                <div style="font-size:0.65rem; opacity:0.6;">${trial.tierName}</div>
                <div class="track-container">
                    <div class="fuzzy-boundary" style="left: ${left}%; width: ${width}%;"></div>
                    <div class="marker" style="left: ${trial.ratio * 100}%; background: ${trial.hex};"></div>
                </div>
                <div style="text-align:right; font-weight:bold; color:${choiceColor}">${choice.toUpperCase()}</div>
            `;
            list.prepend(row);
        }

        function finish() {
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('result-view').style.display = 'block';
            const chart = document.getElementById('chart');

            tierData.forEach((d, i) => {
                const finalRatio = (d.min + d.max) / 2;
                const c = mix(finalRatio, TIERS[i].w, TIERS[i].b);
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${finalRatio * 100}%`;
                bar.style.background = `rgb(${c.r},${c.g},${c.b})`;
                bar.innerHTML = `<div class="bar-label">${TIERS[i].name}</div>`;
                chart.appendChild(bar);
            });
        }

        spawnTrial();
    </script>
</body>
</html>
