<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is My Blue Your Blue? (Paint Mix Edition)</title>
    <style>
        :root {
            --bg-color: #000; 
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            color: white;
            background-color: var(--bg-color);
            overflow: hidden; /* Prevent body scroll, use container scrolls */
        }

        /* 1. Fixed height container for stability */
        #main-container {
            height: 60vh; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.4s ease;
            background-color: var(--bg-color);
            position: relative;
        }

        #ui {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            padding: 2rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            width: 320px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            font-weight: 700;
            color: #111;
            background: white;
        }

        button:active { transform: scale(0.95); }

        /* 1 & 2. Fixed size history, closed by default */
        details {
            height: 40vh;
            background: #111;
            border-top: 2px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }

        summary {
            padding: 15px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            background: #1a1a1a;
            list-style: none;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        #history-scroll-area {
            height: calc(40vh - 50px); /* Adjust for summary height */
            overflow-y: auto;
        }

        .history-row {
            display: grid;
            grid-template-columns: 50px 1fr 140px 70px;
            align-items: center;
            padding: 8px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
        }

        .spectrum-track {
            position: relative;
            height: 18px;
            background: rgba(255,255,255,0.05);
            border-radius: 9px;
            margin: 0 15px;
        }

        .marker {
            position: absolute;
            width: 14px;
            height: 14px;
            top: 2px;
            border: 1px solid white;
            border-radius: 3px;
            transform: translateX(-50%);
        }

        .end-cap { width: 10px; height: 10px; border-radius: 2px; }
        .hex-info { font-family: monospace; opacity: 0.7; }

        #result { display: none; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="ui">
            <div id="quiz">
                <h2 style="margin:0 0 5px 0;">Blue or Green?</h2>
                <p id="progress" style="opacity:0.6; margin: 0 0 20px 0; font-size: 0.9rem;">Trial 1</p>
                <div class="button-container">
                    <button onclick="vote('green')">Green</button>
                    <button onclick="vote('blue')">Blue</button>
                </div>
            </div>

            <div id="result">
                <h3>Boundary Found</h3>
                <div id="final-hex" style="font-size: 1.8rem; font-family: monospace; margin-bottom:5px;"></div>
                <p id="description" style="font-size: 0.9rem; opacity: 0.8;"></p>
                <button onclick="location.reload()" style="margin-top:15px; width: 100%;">Restart</button>
            </div>
        </div>
    </div>

    <details>
        <summary>View History</summary>
        <div id="history-scroll-area">
            <div id="history-list">
                <div class="history-row" style="font-weight:bold; opacity:0.5;">
                    <div>#</div>
                    <div style="display:flex; justify-content: space-between; padding: 0 15px;">
                        <div style="display:flex; align-items:center; gap:4px;"><div class="end-cap" style="background:#00a550;"></div> G</div>
                        <div style="display:flex; align-items:center; gap:4px;">B <div class="end-cap" style="background:#0047ab;"></div></div>
                    </div>
                    <div>Value</div>
                    <div>Choice</div>
                </div>
            </div>
        </div>
    </details>

    <script>
        const PIGMENT_GREEN = { r: 0, g: 165, b: 80 }; 
        const PIGMENT_BLUE = { r: 0, g: 71, b: 171 };
        const PHI = (Math.sqrt(5) - 1) / 2;
        
        let minT = 0;
        let maxT = 1;
        let stepCount = 0;
        let currentT;
        
        // 3. Convergence tracking
        const seenHexes = new Set();

        function mixPaint(w) {
            const w1 = 1 - w;
            const c1 = { r: 255 - PIGMENT_GREEN.r, g: 255 - PIGMENT_GREEN.g, b: 255 - PIGMENT_GREEN.b };
            const c2 = { r: 255 - PIGMENT_BLUE.r, g: 255 - PIGMENT_BLUE.g, b: 255 - PIGMENT_BLUE.b };
            return {
                r: Math.round(255 - (c1.r * w1 + c2.r * w)),
                g: Math.round(255 - (c1.g * w1 + c2.g * w)),
                b: Math.round(255 - (c1.b * w1 + c2.b * w))
            };
        }

        function rgbToHex(rgb) {
            return "#" + [rgb.r, rgb.g, rgb.b].map(x => x.toString(16).padStart(2, '0')).join("");
        }

        function init() {
            // Randomized start: decidedly green or decidedly blue
            currentT = Math.random() < 0.5 ? Math.random() * 0.4 : 0.6 + Math.random() * 0.4;
            updateUI();
        }

        function updateUI() {
            const color = mixPaint(currentT);
            const hex = rgbToHex(color);
            document.documentElement.style.setProperty('--bg-color', hex);
            document.getElementById('progress').innerText = `Trial ${stepCount + 1}`;
            
            // Register hex for next convergence check
            seenHexes.add(hex);
        }

        function addHistoryRow(choice, tVal, hex) {
            const list = document.getElementById('history-list');
            const row = document.createElement('div');
            row.className = 'history-row';
            const percentage = Math.round(tVal * 100);
            
            row.innerHTML = `
                <div>${stepCount + 1}</div>
                <div class="spectrum-track"><div class="marker" style="left: ${percentage}%; background: ${hex};"></div></div>
                <div class="hex-info">${hex} (${percentage}%)</div>
                <div style="font-weight: bold; color: ${choice === 'green' ? '#4ade80' : '#60a5fa'}">${choice.toUpperCase()}</div>
            `;
            list.appendChild(row);
            
            const scrollArea = document.getElementById('history-scroll-area');
            scrollArea.scrollTop = scrollArea.scrollHeight;
        }

        function vote(choice) {
            const currentHex = rgbToHex(mixPaint(currentT));
            addHistoryRow(choice, currentT, currentHex);
            
            stepCount++;

            // Golden Ratio Search Logic
            if (choice === 'green') {
                minT = currentT;
                currentT = minT + (maxT - minT) * PHI;
            } else {
                maxT = currentT;
                currentT = maxT - (maxT - minT) * PHI;
            }

            // 3. Convergence Check: Check if new hex has been seen before
            const nextColor = mixPaint(currentT);
            const nextHex = rgbToHex(nextColor);

            if (seenHexes.has(nextHex) || stepCount >= 20) {
                showResult();
            } else {
                updateUI();
            }
        }

        function showResult() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            const finalColor = mixPaint(currentT);
            const finalHex = rgbToHex(finalColor);
            
            document.getElementById('final-hex').innerText = finalHex;
            document.getElementById('description').innerText = 
                `The search converged at ${Math.round(currentT * 100)}% on the paint spectrum after ${stepCount} trials.`;
            
            document.documentElement.style.setProperty('--bg-color', finalHex);
        }

        init();
    </script>
</body>
</html>
