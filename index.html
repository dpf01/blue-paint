<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- For architecture and logic, see CONTEXT.md -->
    <title>Is my blue paint your blue paint?</title>
    <style>
        :root {
            --phthalo-green: rgb(0, 165, 80);
            --cobalt-blue: rgb(0, 71, 171);
            --carbon-black: rgb(15, 15, 15);
            --titanium-white: rgb(255, 255, 255);
            --bg-color: #1a1a1a;
        }

        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100%;
            font-family: -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; color: white;
            background-color: var(--bg-color); overflow: hidden;
        }

        #main-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            transition: background-color 0.6s ease;
        }

        #ui {
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(25px);
            padding: 2rem; border-radius: 30px; text-align: center;
            width: 420px; border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #tier-name {
            margin: 0;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #aaa;
        }

        #quiz-view h1 {
            margin: 5px 0 20px 0;
            font-size: 1.5rem;
        }

        #progress-text {
            opacity: 0.4;
            font-size: 0.7rem;
            margin-top: 20px;
        }

        #result-view h2 {
            margin: 0;
        }

        .btn-restart {
            margin-top: 20px;
            width: 100%;
            background: white;
            color: black;
            border-radius: 10px;
            font-weight: bold;
        }

        .button-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .row { display: flex; gap: 10px; }
        
        button {
            flex: 1; padding: 16px; border: none; border-radius: 14px;
            cursor: pointer; font-weight: 700; transition: all 0.2s;
            font-size: 1rem;
        }

        .btn-green { background: var(--phthalo-green); color: white; }
        .btn-blue { background: var(--cobalt-blue); color: white; }
        .btn-unsure { background: #333; color: #bbb; border: 1px solid #444; }
        .btn-stop { background: transparent; color: #ff4444; border: 1px solid #ff4444; margin-top: 10px; font-size: 0.8rem; padding: 8px; }
        
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        /* History */
        details { background: #0a0a0a; border-top: 2px solid #222; z-index: 20; }
        details[open] { height: 35vh; }
        summary { padding: 12px; cursor: pointer; text-align: center; background: #111; font-weight: bold; font-size: 0.9rem; }
        #scroll-area { height: calc(35vh - 45px); overflow-y: auto; }

        .history-row {
            display: grid; grid-template-columns: 80px 1fr 80px;
            gap: 15px; align-items: center; padding: 10px 20px;
            border-bottom: 1px solid #1a1a1a; font-size: 0.75rem;
        }

        .history-tier {
            font-size: 0.6rem;
            opacity: 0.6;
            text-transform: uppercase;
        }

        .history-vote {
            text-align: right;
            font-weight: bold;
        }

        .track-container { position: relative; height: 20px; background: #222; border-radius: 10px; overflow: hidden; cursor: crosshair; }
        .fuzzy-boundary { 
            position: absolute; height: 100%; background: rgba(255,255,255,0.12); 
            border-left: 1px solid rgba(255,255,255,0.3); border-right: 1px solid rgba(255,255,255,0.3);
        }
        .marker {
            position: absolute; width: 14px; height: 14px; top: 3px;
            border: 2px solid white; border-radius: 4px; transform: translateX(-50%); z-index: 5;
            transition: transform 0.1s; cursor: pointer;
        }
        .marker:hover { transform: translateX(-50%) scale(1.3); box-shadow: 0 0 10px white; }

        /* Results Chart */
        .chart-layout { display: flex; gap: 10px; margin-top: 30px; align-items: stretch; }
        .y-axis { display: flex; flex-direction: column; justify-content: space-between; font-size: 0.6rem; opacity: 0.6; padding: 15px 0; text-align: right; width: 50px; }
        
        #chart { 
            flex: 1; display: flex; align-items: flex-end; justify-content: space-around; 
            height: 180px; background: #000; border-radius: 12px; padding: 15px 10px; 
            border: 1px solid #333; position: relative;
        }
        
        .bar { width: 14%; position: relative; z-index: 2; border-radius: 4px; overflow: visible; }
        .bar-label { position: absolute; bottom: -25px; width: 100%; text-align: center; font-size: 0.55rem; opacity: 0.7; white-space: nowrap; }
        .bar-percent { position: absolute; top: -22px; width: 100%; text-align: center; font-size: 0.75rem; font-weight: bold; }
        
        /* Average Line */
        .avg-line {
            position: absolute; left: 0; width: 100%; height: 1px;
            border-top: 1px dashed rgba(255,255,255,0.4); z-index: 1; pointer-events: none;
        }
        .avg-label { position: absolute; right: 5px; font-size: 0.5rem; color: rgba(255,255,255,0.5); transform: translateY(-100%); }

        /* Boundary Line */
        .boundary-line {
            position: absolute; left: -10%; width: 120%; height: 2px;
            background: white; z-index: 3; transform: translateY(50%);
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            transition: bottom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #result-view { display: none; }
        #insight-text { font-size: 0.75rem; opacity: 0.8; margin-top: 45px; line-height: 1.5; padding: 0 10px; border-left: 2px solid #444; text-align: left; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="ui">
            <div id="quiz-view">
                <h2 id="tier-name">-</h2>
                <h1>Blue or Green?</h1>
                
                <div class="button-stack">
                    <div class="row">
                        <button class="btn-green" onclick="recordVote('green')">Green</button>
                        <button class="btn-blue" onclick="recordVote('blue')">Blue</button>
                    </div>
                    <button class="btn-unsure" onclick="recordVote('unsure')">I'm Not Sure</button>
                    <button class="btn-stop" onclick="finish()">Stop & See Results</button>
                </div>
                <p id="progress-text">Precision tracking...</p>
            </div>

            <div id="result-view">
                <h2>Perceptual Manifold</h2>
                <div class="chart-layout">
                    <div class="y-axis">
                        <span>100% Blue</span>
                        <span>75%</span>
                        <span>50% Mid</span>
                        <span>25%</span>
                        <span>0% Green</span>
                    </div>
                    <div id="chart"></div>
                </div>
                <div id="insight-text"></div>
                <button class="btn-restart" onclick="location.reload()">Restart Test</button>
            </div>
        </div>
    </div>

    <details>
        <summary>View Data (Click Swatches to Apply Color)</summary>
        <div id="scroll-area">
            <div id="history-list"></div>
        </div>
    </details>

    <script>
        /**
         * The PIGMENTS object defines the physical anchors for our subtractive model.
         * We pull these from CSS variables to ensure a single source of truth for 
         * brand colors across the stylesheet and engine.
         */
        const styles = getComputedStyle(document.documentElement);
        const parseRGB = (val) => {
            const matches = val.match(/\d+/g);
            if (!matches) return { r: 0, g: 0, b: 0 };
            const [r, g, b] = matches.map(Number);
            return { r, g, b };
        };

        const PIGMENTS = {
            PHTHALO_GREEN: parseRGB(styles.getPropertyValue('--phthalo-green')),
            COBALT_BLUE: parseRGB(styles.getPropertyValue('--cobalt-blue')),
            BLACK: parseRGB(styles.getPropertyValue('--carbon-black')),
            WHITE: parseRGB(styles.getPropertyValue('--titanium-white'))
        };

        const TIERS = [
            { name: 'Tint Max', w: 0.45, b: 0 },
            { name: 'Tint Mid', w: 0.22, b: 0 },
            { name: 'Pure', w: 0, b: 0 },
            { name: 'Shade Mid', w: 0, b: 0.35 },
            { name: 'Shade Max', w: 0, b: 0.7 }
        ];

        let tierData = TIERS.map(() => ({ min: 0, max: 1, count: 0 }));
        let history = [];
        let activeTrial = null;
        const TARGET_WIDTH = 0.05;

        /**
         * Inverts a color to its subtractive (CMY-like) equivalent.
         * Subtractive mixing logic is easier to calculate when 0 represents 
         * 'no pigment' and 255 represents 'full pigment'.
         */
        function invertColor(rgb) {
            return {
                r: 255 - rgb.r,
                g: 255 - rgb.g,
                b: 255 - rgb.b
            };
        }

        /**
         * Scales a color by a specific ratio.
         */
        function sample(color, ratio) {
            return {
                r: color.r * ratio,
                g: color.g * ratio,
                b: color.b * ratio
            };
        }

        /**
         * Adds two colors together (additive in the inverted space).
         */
        function addColors(c1, c2) {
            return {
                r: c1.r + c2.r,
                g: c1.g + c2.g,
                b: c1.b + c2.b
            };
        }

        /**
         * Simulates physical paint mixing by calculating proportions in the 
         * inverted (subtractive) color space.
         */
        function mix(ratio, white, black) {
            // First, mix the primary pigment anchors (Green and Blue)
            const invertedGreen = invertColor(PIGMENTS.PHTHALO_GREEN);
            const invertedBlue = invertColor(PIGMENTS.COBALT_BLUE);
            
            const baseMix = addColors(
                sample(invertedGreen, 1 - ratio),
                sample(invertedBlue, ratio)
            );

            // Then, dilute or darken the mix with White and Black pigments.
            // Note: white + black + (1 - white - black) = 1 (total volume)
            const remainingVolume = 1 - white - black;
            const invertedWhite = invertColor(PIGMENTS.WHITE);
            const invertedBlack = invertColor(PIGMENTS.BLACK);

            const finalInverted = addColors(
                addColors(
                    sample(baseMix, remainingVolume),
                    sample(invertedWhite, white)
                ),
                sample(invertedBlack, black)
            );

            // Revert to standard RGB for display.
            return {
                r: Math.max(0, Math.min(255, Math.round(255 - finalInverted.r))),
                g: Math.max(0, Math.min(255, Math.round(255 - finalInverted.g))),
                b: Math.max(0, Math.min(255, Math.round(255 - finalInverted.b)))
            };
        }

        function setPageBackground(hex) {
            document.documentElement.style.setProperty('--bg-color', hex);
        }

        function pickWidestTier() {
            const untested = [];
            tierData.forEach((d, i) => { if (d.count < 1) untested.push(i); });
            if (untested.length > 0) return untested[Math.floor(Math.random() * untested.length)];
            
            let widestIdx = 0, maxWidth = -1;
            tierData.forEach((d, i) => {
                const width = d.max - d.min;
                if (width > maxWidth) { maxWidth = width; widestIdx = i; }
            });
            return widestIdx;
        }

        function spawnTrial() {
            const idx = pickWidestTier();
            const tier = TIERS[idx];
            const data = tierData[idx];
            
            let ratio;
            if (data.count === 0) {
                // For the first trial in a tier, we want to polarize the choice
                // to establish clear bounds early.
                const isGreenLeaning = Math.random() < 0.5;
                if (isGreenLeaning) {
                    ratio = Math.random() * 0.3; // 0% to 30% Blue
                } else {
                    ratio = 0.7 + Math.random() * 0.3; // 70% to 100% Blue
                }
            } else {
                // Subsequent trials focus on the 'fuzzy zone' between the current
                // identified boundaries, with a slight randomized jitter to
                // avoid predictability and explore the space.
                const range = data.max - data.min;
                const jitter = (Math.random() * 0.4) + 0.3; // Random point within 30-70% of the range
                ratio = data.min + (range * jitter);
            }

            ratio = Math.max(0.01, Math.min(0.99, ratio));
            const color = mix(ratio, tier.w, tier.b);
            const hex = "#" + [color.r, color.g, color.b].map(x => x.toString(16).padStart(2, '0')).join("");
            activeTrial = { idx, ratio, hex, tierName: tier.name };
            
            setPageBackground(hex);
            document.getElementById('tier-name').innerText = tier.name;
            const overallWidth = tierData.reduce((acc, d) => acc + (d.max - d.min), 0) / TIERS.length;
            document.getElementById('progress-text').innerText = `Confidence: ${Math.min(100, Math.round((1 - overallWidth) * 100))}% (Trial ${history.length + 1})`;
        }

        function recordVote(choice) {
            const d = tierData[activeTrial.idx];
            
            /**
             * We use a 'Fuzzy Binary Search' approach. Instead of snapping the
             * boundary directly to the trial ratio, we move it 75% of the way.
             * This provides a 'cushion' against user mis-clicks or momentary
             * indecision, allowing the manifold to converge more naturally.
             */
            if (choice === 'green') {
                d.min = d.min + (activeTrial.ratio - d.min) * 0.75;
            } else if (choice === 'blue') {
                d.max = d.max - (d.max - activeTrial.ratio) * 0.75;
            } else {
                // For 'unsure' votes, we gently nudge both boundaries inwards.
                d.min += (activeTrial.ratio - d.min) * 0.15;
                d.max -= (d.max - activeTrial.ratio) * 0.15;
            }

            d.count++;
            addHistoryRow(activeTrial, choice, { ...d });
            history.push({ ...activeTrial, choice });
            if (Math.max(...tierData.map(t => t.max - t.min)) <= TARGET_WIDTH) finish();
            else spawnTrial();
        }

        function addHistoryRow(trial, choice, boundaryState) {
            const list = document.getElementById('history-list');
            const row = document.createElement('div');
            row.className = 'history-row';
            const choiceColor = choice === 'green' ? 'var(--phthalo-green)' : (choice === 'blue' ? 'var(--cobalt-blue)' : '#777');
            const pct = Math.round(trial.ratio * 100);
            
            row.innerHTML = `
                <div class="history-tier">${trial.tierName}</div>
                <div class="track-container">
                    <div class="fuzzy-boundary" style="left: ${boundaryState.min * 100}%; width: ${(boundaryState.max - boundaryState.min) * 100}%;"></div>
                    <div class="marker" 
                         title="${pct}% Blue-ward" 
                         onclick="setPageBackground('${trial.hex}')"
                         style="left: ${trial.ratio * 100}%; background: ${trial.hex};"></div>
                </div>
                <div class="history-vote" style="color:${choiceColor}">${choice.toUpperCase()}</div>
            `;
            list.prepend(row);
        }

        function finish() {
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('result-view').style.display = 'block';
            const chart = document.getElementById('chart');
            chart.innerHTML = '';

            let totalBoundaries = 0;
            tierData.forEach((d, i) => {
                const midpoint = (d.min + d.max) / 2;
                totalBoundaries += midpoint;
                
                // Get the colors for the spectrum
                const cGreen = mix(0, TIERS[i].w, TIERS[i].b);
                const cBlue = mix(1, TIERS[i].w, TIERS[i].b);
                const colorGreen = `rgb(${cGreen.r},${cGreen.g},${cGreen.b})`;
                const colorBlue = `rgb(${cBlue.r},${cBlue.g},${cBlue.b})`;
                
                const barWrapper = document.createElement('div');
                barWrapper.className = 'bar';
                barWrapper.style.height = `100%`;
                barWrapper.style.background = `linear-gradient(to top, ${colorGreen}, ${colorBlue})`;
                
                const boundaryLine = document.createElement('div');
                boundaryLine.className = 'boundary-line';
                // Start at 0 for animation effect
                boundaryLine.style.bottom = '0%';
                
                barWrapper.innerHTML = `
                    <div class="bar-label">${TIERS[i].name}</div>
                    <div class="bar-percent">${Math.round(midpoint * 100)}%</div>
                `;
                barWrapper.appendChild(boundaryLine);
                chart.appendChild(barWrapper);

                // Trigger animation in next frame
                setTimeout(() => {
                    boundaryLine.style.bottom = `${midpoint * 100}%`;
                }, 50);
            });

            const avg = totalBoundaries / TIERS.length;
            const avgLine = document.createElement('div');
            avgLine.className = 'avg-line';
            avgLine.style.bottom = `${avg * 100}%`;
            avgLine.innerHTML = `<span class="avg-label">Avg: ${Math.round(avg*100)}%</span>`;
            chart.appendChild(avgLine);

            generateInsight(avg);
        }

        function generateInsight(avg) {
            const tintAvg = ( (tierData[0].min + tierData[0].max)/2 + (tierData[1].min + tierData[1].max)/2 ) / 2;
            const shadeAvg = ( (tierData[3].min + tierData[3].max)/2 + (tierData[4].min + tierData[4].max)/2 ) / 2;
            const diff = shadeAvg - tintAvg;

            let text = `Your overall boundary is <strong>${Math.round(avg*100)}%</strong>. `;
            if (Math.abs(diff) < 0.04) {
                text += "Your perception is very consistent; you see the blue/green boundary at the same point regardless of how light or dark the paint is.";
            } else if (diff > 0) {
                text += "You exhibit a <strong>shade-drift</strong>: you perceive darker colors as greener. You require more blue pigment in a dark mix before you stop calling it 'green'.";
            } else {
                text += "You exhibit a <strong>tint-drift</strong>: you perceive lighter colors as greener. Pale turquoises look 'green' to you even when they contain significant blue.";
            }
            document.getElementById('insight-text').innerHTML = text;
        }

        spawnTrial();
    </script>
</body>
</html>
